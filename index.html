<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Movie &amp; Show Tracker</title>
  <meta name="description" content="Track movies and shows you want to watch, are watching, and have watched.">
  <meta name="theme-color" content="#1d6b58" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12171d" media="(prefers-color-scheme: dark)">
  <script>try { var t = localStorage.getItem("wt.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Movie &amp; Show Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <div class="p-top" id="top"></div>
    <main class="p-body" id="body" tabindex="-1"></main>
    <nav class="p-nav" id="nav" aria-label="App sections"></nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Built-in keys for this deployment. -->
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
